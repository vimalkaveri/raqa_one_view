name: raqa_one_view
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  usb_serial: ^0.5.2
  image_picker: ^1.2.3
  file_picker: ^12.0.0
  flutter_svg: ^2.3.0
  vector_graphics: ^1.2.3
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/app_icon.png
    - assets/images/logo.png
    - assets/images/layout.svg
    - assets/sounds/fire_alarm.mp3